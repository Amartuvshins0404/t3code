name: t3-infra

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  auth:
    image: ghcr.io/amartuvshins0404/t3-auth:${AUTH_TAG:?}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/auth
      BETTER_AUTH_URL: https://auth.amartuvshin.com
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      GH_OAUTH_CLIENT_ID: ${GH_OAUTH_CLIENT_ID:-}
      GH_OAUTH_CLIENT_SECRET: ${GH_OAUTH_CLIENT_SECRET:-}
    ports:
      - 127.0.0.1:3100:3000
    logging: *logging

volumes:
  postgres-data:
