name: t3-infra

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  auth:
    image: ghcr.io/amartuvshins0404/t3-auth:${AUTH_TAG:?}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/auth
      BETTER_AUTH_URL: https://auth.amartuvshin.com
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      GH_OAUTH_CLIENT_ID: ${GH_OAUTH_CLIENT_ID:-}
      GH_OAUTH_CLIENT_SECRET: ${GH_OAUTH_CLIENT_SECRET:-}
    ports:
      - 127.0.0.1:3100:3000
    logging: *logging

  relay:
    image: ghcr.io/amartuvshins0404/t3-relay:${RELAY_TAG:?}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/relay
      AUTH_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/auth
      RELAY_PUBLIC_URL: https://relay.amartuvshin.com
      RELAY_AUTH_ISSUER: https://auth.amartuvshin.com
      RELAY_AUTH_JWKS_URL: https://auth.amartuvshin.com/api/auth/jwks
      RELAY_AUTH_AUDIENCE: t3-relay
      RELAY_SIGNING_PRIVATE_KEY: ${RELAY_SIGNING_PRIVATE_KEY:?}
      RELAY_MAX_TUNNELS_PER_USER: "25"
      RELAY_TUNNEL_ZONE_NAME: amartuvshin.com
      RELAY_TUNNEL_NAMESPACE: t3
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?}
      CLOUDFLARE_ACCOUNT_ID: 402eb63f8e50395d0a10622f78f46a9c
      CLOUDFLARE_ZONE_ID: c9cd43a8941738516ebe384e7efafcf9
    ports:
      - 127.0.0.1:3200:8787
    logging: *logging

volumes:
  postgres-data:
