name: Merge Lane

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches: [amaraa-mode]
  workflow_run:
    workflows: [Blind Checks]
    types: [completed]

permissions: {}

jobs:
  lane:
    if: github.repository == 'Amartuvshins0404/t3code'
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    uses: Amartuvshins0404/agent-trust/.github/workflows/merge-lane.yml@bfcb74f13dec1042f808438e37637810c5473357 # v0 + agent-trust#7

  result:
    name: Merge lane
    needs: lane
    if: always() && github.repository == 'Amartuvshins0404/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Pass only when the lane job passed
        env:
          RESULT: ${{ needs.lane.result }}
        run: test "$RESULT" = success
