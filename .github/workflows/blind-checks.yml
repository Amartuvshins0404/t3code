name: Blind Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [amaraa-mode]

permissions:
  contents: read

concurrency:
  group: blind-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proof:
    name: Blind checks
    if: github.repository == 'Amartuvshins0404/t3code'
    runs-on: ${{ github.repository == 'pingdotgg/t3code' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 27
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BLIND_CHECKS_MODE: ${{ vars.BLIND_CHECKS_MODE }}
    steps:
      - name: Fetch the pull request commits and the judge from the base branch
        id: fetch
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --filter=tree:0 origin "$HEAD_SHA" "$BASE_SHA"
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          first="$(git rev-list --reverse --first-parent "$base..$HEAD_SHA" | sed -n 1p)"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          mkdir -p "$RUNNER_TEMP/judge" "$RUNNER_TEMP/proof"
          git archive "$BASE_SHA" .github/scripts | tar -x -C "$RUNNER_TEMP/judge"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "first=$first" >> "$GITHUB_OUTPUT"

      - name: Find the checks
        id: plan
        shell: bash
        env:
          PROOF_BASE: ${{ steps.fetch.outputs.base }}
          FIRST_SHA: ${{ steps.fetch.outputs.first }}
        run: |
          set -euo pipefail
          judge="$RUNNER_TEMP/judge/.github/scripts/blind-checks.cjs"
          if [[ ! -f "$judge" ]]; then
            printf '### Blind checks: skipped\n\nThe base branch has no blind-checks judge yet.\n' >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node "$judge" plan --base "$PROOF_BASE" --head "$HEAD_SHA" --commit "$FIRST_SHA" --dir "$RUNNER_TEMP/proof"

      - name: Check out the base code
        if: steps.plan.outputs.run == 'true'
        env:
          PROOF_BASE: ${{ steps.fetch.outputs.base }}
        run: git checkout -q --detach "$PROOF_BASE"

      - name: Setup Vite+
        if: steps.plan.outputs.run == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          save-pnpm-store: "false"

      - name: Install Chromium for browser tests
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.browser == 'true'
        run: |
          node apps/web/node_modules/playwright/cli.js install --only-shell chromium
          node apps/web/node_modules/playwright/cli.js install-deps chromium

      - name: Ensure Electron runtime is installed
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.desktop == 'true'
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Run the old checks on the base code
        if: steps.plan.outputs.run == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          [[ -s "$RUNNER_TEMP/proof/base-files.txt" ]] || exit 0
          mapfile -t files < "$RUNNER_TEMP/proof/base-files.txt"
          vp test run --reporter=json --outputFile="$RUNNER_TEMP/proof/baseline.json" "${files[@]}" || true

      - name: Bring in the checks from the head
        if: steps.plan.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.files[].file, .support[]?' "$RUNNER_TEMP/proof/plan.json" | tr '\n' '\0' | xargs -0 git checkout -q "$HEAD_SHA" --

      - name: Run the checks without the code
        if: steps.plan.outputs.run == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          mapfile -t files < "$RUNNER_TEMP/proof/files.txt"
          vp test run --reporter=json --outputFile="$RUNNER_TEMP/proof/before.json" "${files[@]}" || true

      - name: Check out the pull request head
        if: steps.plan.outputs.run == 'true'
        run: |
          git checkout -q --detach "$HEAD_SHA"
          vp install

      - name: Run the checks with the code
        if: steps.plan.outputs.run == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          mapfile -t files < "$RUNNER_TEMP/proof/files.txt"
          vp test run --reporter=json --outputFile="$RUNNER_TEMP/proof/after.json" "${files[@]}" || true

      - name: Judge
        if: steps.plan.outputs.run == 'true'
        run: node "$RUNNER_TEMP/judge/.github/scripts/blind-checks.cjs" judge --dir "$RUNNER_TEMP/proof"

      - name: Measure test strength
        id: strength
        if: steps.plan.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        env:
          FIRST_SHA: ${{ steps.fetch.outputs.first }}
          TEST_STRENGTH_MODE: ${{ vars.TEST_STRENGTH_MODE }}
        run: |
          runner="$RUNNER_TEMP/judge/.github/scripts/test-strength.cjs"
          if [[ ! -f "$runner" ]]; then
            printf '### Test strength: skipped\n\nThe base branch has no test-strength check yet.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node "$runner" measure --first "$FIRST_SHA" --base "$BASE_SHA" --head "$HEAD_SHA" --out "$RUNNER_TEMP/strength"

      - name: Upload the test strength measurement
        if: always() && steps.strength.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-strength
          path: ${{ runner.temp }}/strength/measurement.json
          if-no-files-found: ignore
          retention-days: 14
