name: Blind Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [amaraa-mode]

permissions:
  contents: read

jobs:
  proof:
    if: github.repository == 'Amartuvshins0404/t3code'
    permissions:
      contents: read
    uses: Amartuvshins0404/agent-trust/.github/workflows/blind-checks.yml@bfcb74f13dec1042f808438e37637810c5473357 # v0 + agent-trust#7

  result:
    name: Blind checks
    needs: proof
    if: always() && github.repository == 'Amartuvshins0404/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Pass only when the proof job passed
        env:
          RESULT: ${{ needs.proof.result }}
        run: test "$RESULT" = success
