name: Fork mobile Android

on:
  push:
    tags:
      - mobile-v*
  workflow_dispatch:

concurrency:
  group: fork-mobile-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build the Android app
    if: github.repository == 'Amartuvshins0404/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
      T3CODE_OWNER_NAME: ${{ vars.OWNER_NAME }}
      T3CODE_OWNER_LOGO: assets/owner/logo.jpg
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check the owner name
        run: |
          if [[ -z "$T3CODE_OWNER_NAME" ]]; then
            echo "Set the OWNER_NAME repository variable." >&2
            exit 1
          fi

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Export the owner icons
        run: vp run icons:export

      - name: Generate the Android project
        working-directory: apps/mobile
        run: ./node_modules/.bin/expo prebuild --clean --platform android --no-install

      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease

      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: amaraa-mode-android
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
